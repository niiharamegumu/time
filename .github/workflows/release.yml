name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Decide release eligibility
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");

            const tauriConfig = JSON.parse(
              fs.readFileSync("src-tauri/tauri.conf.json", "utf8"),
            );
            const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const cargoToml = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            const cargoVersion = cargoToml.match(/^version\s*=\s*"([^"]+)"/m)?.[1];

            if (!tauriConfig.version) {
              core.setFailed("src-tauri/tauri.conf.json に version が必要です。");
              return;
            }

            if (
              tauriConfig.version !== packageJson.version ||
              tauriConfig.version !== cargoVersion
            ) {
              core.setFailed(
                `Version mismatch: tauri=${tauriConfig.version}, package=${packageJson.version}, cargo=${cargoVersion}`,
              );
              return;
            }

            const tagName = `v${tauriConfig.version}`;
            let releaseExists = false;

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              });
              releaseExists = true;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            core.info(`current app tag: ${tagName}`);
            core.info(`release already exists: ${releaseExists}`);

            core.setOutput("should_release", String(!releaseExists));
            core.setOutput("tag_name", tagName);
            core.setOutput("version", tauriConfig.version);

  release:
    needs: release-check
    if: needs.release-check.outputs.should_release == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify required updater configuration
        run: |
          node <<'EOF'
          const fs = require("node:fs");

          const pubkey = process.env.TAURI_UPDATER_PUBKEY;

          if (!pubkey) {
            throw new Error("Repository variable TAURI_UPDATER_PUBKEY is required.");
          }

          const path = "src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));

          config.plugins ??= {};
          config.plugins.updater ??= {};
          config.plugins.updater.pubkey = pubkey;

          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          EOF

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0.6.2
        with:
          includeUpdaterJson: true
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          releaseName: "Time v__VERSION__"
          tagName: "v__VERSION__"
